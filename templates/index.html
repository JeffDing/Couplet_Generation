<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新春对联生成器</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        /* 确保字体在保存时正确加载 */
        @font-face {
            font-family: 'Ma Shan Zheng';
            font-display: swap;
        }
        @font-face {
            font-family: 'ZCOOL XiaoWei';
            font-display: swap;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 标题区域 -->
        <div class="title-area">
            <h1 class="main-title">新春对联生成器</h1>
            <p class="subtitle">AI为您生成专属新春对联</p>
        </div>

        <!-- 主内容区域 -->
        <div class="main-content">
            <!-- 左侧：个性化定制区域 -->
            <div class="customization-area">
                <h2 class="section-title">个性化定制</h2>
                
                <!-- 关键词输入 -->
                <div class="input-group">
                    <label for="keywords">关键词</label>
                    <input type="text" id="keywords" placeholder="请输入关键词，如：福、春、财..." maxlength="20">
                    <span class="input-hint">可输入1-3个关键词，用空格分隔</span>
                </div>
                
                <!-- 对联风格选择 -->
                <div class="input-group">
                    <label>对联风格</label>
                    <div class="style-options">
                        <label class="style-option">
                            <input type="radio" name="style" value="traditional" checked>
                            <span class="style-label">传统典雅</span>
                        </label>
                        <label class="style-option">
                            <input type="radio" name="style" value="modern">
                            <span class="style-label">现代创新</span>
                        </label>
                    </div>
                </div>
                
                <!-- 按钮区域 -->
                <div class="button-area">
                    <button class="generate-btn primary-btn" id="generateBtn" onclick="generateCouplet()">
                        <span class="btn-text">生成对联</span>
                        <span class="btn-icon">✨</span>
                    </button>
                    <button class="generate-btn save-btn" id="saveBtn" onclick="saveCoupletImage()">
                        <span class="btn-text">保存图片</span>
                        <span class="btn-icon">💾</span>
                    </button>
                    <button class="generate-btn copy-btn" id="copyBtn" onclick="copyCoupletText()">
                        <span class="btn-text">复制文字</span>
                        <span class="btn-icon">📋</span>
                    </button>
                </div>
            </div>

            <!-- 右侧：对联展示区域 -->
            <div class="couplet-container">
                <!-- 大门纹理背景 -->
                <div class="door-texture"></div>
                
                <!-- 金色装饰边框 -->
                <div class="door-border"></div>
                
                <!-- 门钉装饰 -->
                <div class="door-nail" style="top: 40px; left: 40px;"></div>
                <div class="door-nail" style="top: 40px; right: 40px;"></div>
                <div class="door-nail" style="bottom: 40px; left: 40px;"></div>
                <div class="door-nail" style="bottom: 40px; right: 40px;"></div>
                <div class="door-nail" style="top: 100px; left: 40px;"></div>
                <div class="door-nail" style="top: 100px; right: 40px;"></div>
                <div class="door-nail" style="bottom: 100px; left: 40px;"></div>
                <div class="door-nail" style="bottom: 100px; right: 40px;"></div>
                
                <!-- 门环装饰 -->
                <div class="door-knocker" style="top: 50%; left: 30px; transform: translateY(-50%);"></div>
                <div class="door-knocker" style="top: 50%; right: 30px; transform: translateY(-50%);"></div>
                
                <!-- 横批 -->
                <div class="horizontal-scroll-wrapper">
                    <div class="horizontal-scroll" id="horizontalScroll">
                        <span class="scroll-text" id="horizontalText">福满人间</span>
                    </div>
                </div>

                <!-- 对联主体 -->
                <div class="couplet-main">
                    <!-- 上联 -->
                    <div class="scroll-wrapper left">
                        <div class="scroll upper-scroll" id="upperScroll">
                            <div class="scroll-top"></div>
                            <div class="scroll-body">
                                <div class="scroll-content" id="upperText">
                                    <span>春</span>
                                    <span>风</span>
                                    <span>送</span>
                                    <span>暖</span>
                                    <span>入</span>
                                    <span>屠</span>
                                    <span>苏</span>
                                </div>
                            </div>
                            <div class="scroll-bottom"></div>
                        </div>
                    </div>

                    <!-- 中间装饰 -->
                    <div class="center-decoration">
                        <div class="fu-character">福</div>
                    </div>

                    <!-- 下联 -->
                    <div class="scroll-wrapper right">
                        <div class="scroll lower-scroll" id="lowerScroll">
                            <div class="scroll-top"></div>
                            <div class="scroll-body">
                                <div class="scroll-content" id="lowerText">
                                    <span>瑞</span>
                                    <span>雪</span>
                                    <span>迎</span>
                                    <span>春</span>
                                    <span>到</span>
                                    <span>家</span>
                                    <span>门</span>
                                </div>
                            </div>
                            <div class="scroll-bottom"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 加载提示 -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-content">
                <div class="loading-spinner"></div>
                <p class="loading-text">正在为您生成对联...</p>
            </div>
        </div>

        <!-- 错误提示 -->
        <div class="error-toast" id="errorToast">
            <span class="error-text" id="errorText"></span>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
